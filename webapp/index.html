<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог недвижимости</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f4f5);
            --text-color: var(--tg-theme-text-color, #111);
            --card-bg: var(--tg-theme-secondary-bg-color, #fff);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #fff);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
        }
        .filters {
            position: sticky;
            top: 0;
            background: var(--bg-color);
            padding: 8px 0 12px 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .filter-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-row::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            background: var(--card-bg);
            border: 1px solid #d1d1d6;
            padding: 5px 8px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-color);
            flex: 1;
            text-align: center;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--button-color);
            color: var(--button-text);
            border-color: transparent;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .card:active {
            transform: scale(0.97);
        }
        .card-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .price {
            font-weight: 700;
            color: var(--button-color);
            font-size: 16px;
        }
        .title {
            font-size: 13px;
            font-weight: 600;
        }
        .details {
            font-size: 12px;
            color: #8e8e93;
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            padding: 30px;
            color: #8e8e93;
        }

        /* Полноэкранное модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            background: var(--card-bg);
            width: 100%;
            height: 95vh; /* Почти во весь экран по высоте */
            border-radius: 20px 20px 0 0;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-color);
            padding: 4px 8px;
        }
        /* Увеличенный контейнер для медиафайлов */
        .modal-image-container {
            position: relative;
            width: 100%;
            height: 340px; /* Сделали плеер значительно выше и удобнее для просмотра */
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .modal-image-container img, .modal-image-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .media-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .media-prev { left: 10px; }
        .media-next { right: 10px; }
        .media-counter {
            position: absolute;
            bottom: 10px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
        }
        .no-photo {
            color: #8e8e93;
            font-size: 14px;
        }
        .modal-info-row {
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            padding: 8px 0;
        }
        .action-btn {
            background: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: auto; /* Прижимает кнопку в самый низ */
        }
    </style>
</head>
<body>

    <div class="filters">
        <div class="filter-row">
            <button class="filter-btn active" onclick="setCategory('Rent', this)">🔑 Аренда</button>
            <button class="filter-btn" onclick="setCategory('Sales', this)">💰 Продажа</button>
        </div>
        <div class="filter-row">
            <button class="filter-btn active" onclick="setPropType('all', this)">Все типы</button>
            <button class="filter-btn" onclick="setPropType('Apartments', this)">🏢 Квартиры</button>
            <button class="filter-btn" onclick="setPropType('Houses', this)">🏠 Дома</button>
        </div>
        <div class="filter-row">
            <button class="filter-btn" onclick="toggleRooms('1', this)">1 к.</button>
            <button class="filter-btn" onclick="toggleRooms('2', this)">2 к.</button>
            <button class="filter-btn" onclick="toggleRooms('3', this)">3 к.</button>
            <button class="filter-btn" onclick="toggleRooms('4', this)">4 к.</button>
            <button class="filter-btn" onclick="toggleRooms('5+', this)">5+ к.</button>
        </div>
    </div>

    <div id="catalog" class="grid">
        <div class="loading">Загрузка каталога...</div>
    </div>

    <!-- Модальное окно -->
    <div id="adModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span id="modalTitle">Объект</span>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            
            <!-- Большой блок для медиафайлов -->
            <div id="modalMedia" class="modal-image-container">
                <span class="no-photo">⏳ Загрузка медиа...</span>
            </div>

            <div id="modalBody"></div>
            <button class="action-btn" onclick="contactAgent()">Связаться с риелтором</button>
        </div>
    </div>

    <script>
        let currentCategory = 'Rent';
        let currentPropType = 'all';
        let currentRooms = 'all';
        let allAdsCache = [];
        let selectedAd = null;
        let currentMediaList = [];
        let currentMediaIndex = 0;

        const tg = window.Telegram.WebApp;
        tg.expand();

        async function loadAds() {
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '<div class="loading">Загрузка...</div>';

            try {
                const response = await fetch(`/api/ads?category=${currentCategory}&prop_type=${currentPropType}`);
                allAdsCache = await response.json();
                renderAds();
            } catch (err) {
                console.error(err);
                catalog.innerHTML = '<div class="loading">Ошибка загрузки данных</div>';
            }
        }

        function renderAds() {
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '';

            const filteredAds = allAdsCache.filter(ad => {
                if (currentRooms === 'all') return true;
                if (ad.rooms === null || ad.rooms === undefined) return false;
                const roomsStr = String(ad.rooms).trim();
                if (currentRooms === '5+') {
                    const match = roomsStr.match(/\d+/);
                    if (!match) return false;
                    return parseInt(match[0], 10) >= 5;
                } else {
                    return roomsStr.startsWith(currentRooms);
                }
            });

            if (filteredAds.length === 0) {
                catalog.innerHTML = '<div class="loading">📭 По вашему запросу объектов не найдено</div>';
                return;
            }

            filteredAds.forEach(ad => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(ad);

                const priceFormatted = Number(ad.price).toLocaleString('ru-RU');
                const typeIcon = ad.prop_type === 'Houses' ? '🏠 Дом' : '🏢 Квартира';

                card.innerHTML = `
                    <div class="card-body">
                        <div class="price">${priceFormatted} $</div>
                        <div class="title">${typeIcon} №${ad.ad_num}</div>
                        <div class="details">📍 ${ad.district || 'Район не указан'}</div>
                        <div class="details">🚪 Комнат: ${ad.rooms || '—'}</div>
                    </div>
                `;
                catalog.appendChild(card);
            });
        }

        async function openModal(ad) {
            selectedAd = ad;
            document.getElementById('modalTitle').innerText = `${ad.prop_type === 'Houses' ? '🏠 Дом' : '🏢 Квартира'} №${ad.ad_num}`;

            const priceFormatted = Number(ad.price).toLocaleString('ru-RU');
            const categoryText = ad.category === 'Rent' ? 'Аренда' : 'Продажа';

            document.getElementById('modalBody').innerHTML = `
                <div class="modal-info-row"><span>Цена:</span> <strong>${priceFormatted} $</strong></div>
                <div class="modal-info-row"><span>Категория:</span> <strong>${categoryText}</strong></div>
                <div class="modal-info-row"><span>Район:</span> <strong>${ad.district || '—'}</strong></div>
                <div class="modal-info-row"><span>Ориентир:</span> <strong>${ad.landmark || '—'}</strong></div>
                <div class="modal-info-row"><span>Комнат:</span> <strong>${ad.rooms || '—'}</strong></div>
                <div class="modal-info-row"><span>Площадь:</span> <strong>${ad.area ? ad.area + ' м²' : '—'}</strong></div>
                <div class="modal-info-row"><span>Этаж:</span> <strong>${ad.floor || '—'} / ${ad.floors_total || '—'}</strong></div>
            `;

            const mediaContainer = document.getElementById('modalMedia');
            mediaContainer.innerHTML = `<span class="no-photo">⏳ Загрузка фото и видео...</span>`;
            document.getElementById('adModal').classList.add('open');

            try {
                const res = await fetch(`/api/media-list/${ad.ad_num}`);
                currentMediaList = await res.json();
                currentMediaIndex = 0;
                renderMediaViewer();
            } catch (e) {
                mediaContainer.innerHTML = `<span class="no-photo">📸 Медиафайлы отсутствуют</span>`;
            }
        }

        function renderMediaViewer() {
            const mediaContainer = document.getElementById('modalMedia');
            if (!currentMediaList || currentMediaList.length === 0) {
                mediaContainer.innerHTML = `<span class="no-photo">📸 Фото и видео отсутствуют</span>`;
                return;
            }

            const item = currentMediaList[currentMediaIndex];
            const url = `/api/media-file/${item.id}`;
            let mediaHtml = '';

            if (item.type === 'video') {
                mediaHtml = `<video src="${url}" controls playsinline></video>`;
            } else {
                mediaHtml = `<img src="${url}" alt="Медиа">`;
            }

            if (currentMediaList.length > 1) {
                mediaHtml += `
                    <button class="media-nav-btn media-prev" onclick="prevMedia(event)">❮</button>
                    <button class="media-nav-btn media-next" onclick="nextMedia(event)">❯</button>
                    <div class="media-counter">${currentMediaIndex + 1} / ${currentMediaList.length}</div>
                `;
            }

            mediaContainer.innerHTML = mediaHtml;
        }

        function prevMedia(e) {
            e.stopPropagation();
            if (currentMediaIndex > 0) {
                currentMediaIndex--;
                renderMediaViewer();
            }
        }

        function nextMedia(e) {
            e.stopPropagation();
            if (currentMediaIndex < currentMediaList.length - 1) {
                currentMediaIndex++;
                renderMediaViewer();
            }
        }

        function closeModal() {
            document.getElementById('adModal').classList.remove('open');
            document.getElementById('modalMedia').innerHTML = '';
        }

        function contactAgent() {
            if (selectedAd) {
                tg.sendData(JSON.stringify({ action: "contact", ad_num: selectedAd.ad_num }));
                tg.close();
            }
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.filter-row:nth-child(1) .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadAds();
        }

        function setPropType(type, btn) {
            currentPropType = type;
            document.querySelectorAll('.filter-row:nth-child(2) .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadAds();
        }

        function toggleRooms(rooms, btn) {
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                currentRooms = 'all';
            } else {
                document.querySelectorAll('.filter-row:nth-child(3) .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentRooms = rooms;
            }
            renderAds();
        }

        loadAds();
    </script>
</body>
</html>
