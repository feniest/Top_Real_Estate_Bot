<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог недвижимости</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f4f5);
            --text-color: var(--tg-theme-text-color, #111);
            --card-bg: var(--tg-theme-secondary-bg-color, #fff);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #fff);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
        }
        .filters {
            position: sticky;
            top: 0;
            background: var(--bg-color);
            padding: 8px 0 12px 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .filter-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-row::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            background: var(--card-bg);
            border: 1px solid #d1d1d6;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-color);
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--button-color);
            color: var(--button-text);
            border-color: transparent;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        .card-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .price {
            font-weight: 700;
            color: var(--button-color);
            font-size: 16px;
        }
        .title {
            font-size: 13px;
            font-weight: 600;
        }
        .details {
            font-size: 12px;
            color: #8e8e93;
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            padding: 30px;
            color: #8e8e93;
        }
    </style>
</head>
<body>

    <!-- Панель фильтров -->
    <div class="filters">
        <!-- Ряд 1: Аренда / Продажа -->
        <div class="filter-row">
            <button class="filter-btn active" onclick="setCategory('Rent', this)">🔑 Аренда</button>
            <button class="filter-btn" onclick="setCategory('Sales', this)">💰 Продажа</button>
        </div>
        <!-- Ряд 2: Тип недвижимости -->
        <div class="filter-row">
            <button class="filter-btn active" onclick="setPropType('all', this)">Все типы</button>
            <button class="filter-btn" onclick="setPropType('Apartments', this)">🏢 Квартиры</button>
            <button class="filter-btn" onclick="setPropType('Houses', this)">🏠 Дома</button>
        </div>
        <!-- Ряд 3: Количество комнат (без кнопки "Все комнаты", теперь фильтр переключаемый) -->
        <div class="filter-row">
            <button class="filter-btn" onclick="toggleRooms('1', this)">1 комн.</button>
            <button class="filter-btn" onclick="toggleRooms('2', this)">2 комн.</button>
            <button class="filter-btn" onclick="toggleRooms('3', this)">3 комн.</button>
            <button class="filter-btn" onclick="toggleRooms('4', this)">4 комн.</button>
            <button class="filter-btn" onclick="toggleRooms('5+', this)">5+ комн.</button>
        </div>
    </div>

    <!-- Сетка карточек -->
    <div id="catalog" class="grid">
        <div class="loading">Загрузка каталога...</div>
    </div>

    <script>
        let currentCategory = 'Rent';
        let currentPropType = 'all';
        let currentRooms = 'all';

        const tg = window.Telegram.WebApp;
        tg.expand();

        async function loadAds() {
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '<div class="loading">Загрузка...</div>';

            try {
                const response = await fetch(`/api/ads?category=${currentCategory}&prop_type=${currentPropType}&rooms=${currentRooms}`);
                const ads = await response.json();
                
                catalog.innerHTML = '';

                if (ads.length === 0) {
                    catalog.innerHTML = '<div class="loading">📭 По вашему запросу объектов не найдено</div>';
                    return;
                }

                ads.forEach(ad => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const priceFormatted = Number(ad.price).toLocaleString('ru-RU');
                    const typeIcon = ad.prop_type === 'Houses' ? '🏠 Дом' : '🏢 Квартира';

                    card.innerHTML = `
                        <div class="card-body">
                            <div class="price">${priceFormatted} $</div>
                            <div class="title">${typeIcon} №${ad.ad_num}</div>
                            <div class="details">📍 ${ad.district || 'Район не указан'}</div>
                            <div class="details">🚪 Комнат: ${ad.rooms || '—'}</div>
                        </div>
                    `;
                    catalog.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                catalog.innerHTML = '<div class="loading">Ошибка загрузки данных</div>';
            }
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.filter-row:nth-child(1) .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadAds();
        }

        function setPropType(type, btn) {
            currentPropType = type;
            document.querySelectorAll('.filter-row:nth-child(2) .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadAds();
        }

        // Логика переключения комнат (если кнопка уже активна — сбрасываем фильтр)
        function toggleRooms(rooms, btn) {
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                currentRooms = 'all';
            } else {
                document.querySelectorAll('.filter-row:nth-child(3) .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentRooms = rooms;
            }
            loadAds();
        }

        loadAds();
    </script>
</body>
</html>
